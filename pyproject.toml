[project]
name = "choralebricks"
version = "1.1.0"
description = "Supporting package for the ChoraleBricks dataset."
authors = [
    { name = "Stefan Balke", email = "stefan.balke@audiolabs-erlangen.de" },
    { name = "Manuel Peters", email = "manuel.petets@audiolabs-erlangen.de" },
]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
keywords = [
    "mir",
    "dataset",
    "instruments",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.18.0",
    "scipy>=1.4.0",
    "soundfile",
    "pydantic",
    "pandas>=2.2.3,<3",
    "lark>=1.2.0",
    "matplotlib>=3.0.0",
]

[project.optional-dependencies]
examples = [
    "numba",
    "seaborn",
    "librosa>=0.11.0",
]
docs = ["sphinx"]

[project.urls]
Homepage = "https://www.audiolabs-erlangen.de/resources/MIR/2025-ChoraleBricks"
Repository = "https://github.com/stefan-balke/choralebricks"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "tqdm>=4.68.3",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=choralebricks --cov-report=term-missing"
python_files = ["test_*.py", "*_test.py"]

[tool.black]
line-length = 120  # Default is 88, but you can set this to your preferred length
target-version = ["py39"]  # Set the Python version(s) you're targeting
skip-string-normalization = true  # Optional: keep original quote styles
include = '\.pyi?$'  # Only format .py and .pyi files
